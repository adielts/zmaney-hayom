<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Sun rays -->
  <g fill="#d4a857" opacity="0.6">
    <rect x="92" y="20" width="8" height="25" rx="4"/>
    <rect x="92" y="147" width="8" height="25" rx="4"/>
    <rect x="20" y="92" width="25" height="8" rx="4"/>
    <rect x="147" y="92" width="25" height="8" rx="4"/>
    <rect x="45" y="40" width="8" height="25" rx="4" transform="rotate(45 49 52.5)"/>
    <rect x="139" y="127" width="8" height="25" rx="4" transform="rotate(45 143 139.5)"/>
    <rect x="139" y="40" width="8" height="25" rx="4" transform="rotate(-45 143 52.5)"/>
    <rect x="45" y="127" width="8" height="25" rx="4" transform="rotate(-45 49 139.5)"/>
  </g>
  <!-- Sun circle -->
  <circle cx="96" cy="96" r="40" fill="#d4a857"/>
  <!-- Clock hands -->
  <line x1="96" y1="96" x2="96" y2="70" stroke="#1a365d" stroke-width="4" stroke-linecap="round"/>
  <line x1="96" y1="96" x2="115" y2="96" stroke="#1a365d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="96" cy="96" r="5" fill="#1a365d"/>
</svg>
