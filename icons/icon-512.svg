<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Sun rays -->
  <g fill="#d4a857" opacity="0.6">
    <rect x="244" y="50" width="24" height="70" rx="12"/>
    <rect x="244" y="392" width="24" height="70" rx="12"/>
    <rect x="50" y="244" width="70" height="24" rx="12"/>
    <rect x="392" y="244" width="70" height="24" rx="12"/>
    <rect x="115" y="100" width="24" height="70" rx="12" transform="rotate(45 127 135)"/>
    <rect x="373" y="342" width="24" height="70" rx="12" transform="rotate(45 385 377)"/>
    <rect x="373" y="100" width="24" height="70" rx="12" transform="rotate(-45 385 135)"/>
    <rect x="115" y="342" width="24" height="70" rx="12" transform="rotate(-45 127 377)"/>
  </g>
  <!-- Sun circle -->
  <circle cx="256" cy="256" r="110" fill="#d4a857"/>
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="180" stroke="#1a365d" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="310" y2="256" stroke="#1a365d" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="15" fill="#1a365d"/>
</svg>
