<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tfila Compass - UX mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/styles.css">
<style>
  /* Static mockup: freeze all motion so screenshots are deterministic */
  *, *::before, *::after { animation: none !important; transition: none !important; }

  /* Fixed 390x844 "phone"; transform makes it the containing block for position:fixed children */
  #root {
    position: absolute; left: 0; top: 0; width: 390px; height: 844px; overflow: hidden; transform: translateZ(0);
    background: radial-gradient(circle at 50% -10%, var(--body-glow) 0%, transparent 55%), var(--bg-body);
  }
  #root .modal { max-height: 700px; }

  .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ico .needle { fill: currentColor; stroke: none; }
  .btn-icon { display: inline-flex; align-items: center; justify-content: center; }

  /* Option A - floating button mirrored to the settings button */
  .btn-compass-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 200;
    display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 20px;
    border-radius: 999px; border: 2px solid var(--color-gold-dark);
    background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold));
    color: var(--color-primary-dark); font-family: inherit; font-size: 1rem; font-weight: 700;
    box-shadow: var(--shadow-lg), 0 0 0 4px rgba(212,168,87,.18);
  }
  .btn-compass-fab .ico { width: 22px; height: 22px; stroke-width: 2; }

  /* Option B - second icon in the location panel */
  .location-actions { display: flex; gap: 8px; }

  /* Option C - header icon */
  .header { position: relative; }
  .header-compass-btn {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; z-index: 2;
  }

  /* Option D - live mini compass card */
  .qibla-card { margin: 16px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
  .qibla-card-dial { width: 56px; height: 56px; flex-shrink: 0; }
  .qibla-card-text { flex: 1; min-width: 0; }
  .qibla-card-title { font-size: .75rem; letter-spacing: 2px; color: var(--text-on-panel-muted); }
  .qibla-card-dir { font-size: 1.125rem; font-weight: 700; color: var(--accent-strong); }
  .qibla-card-sub { font-size: .8rem; color: var(--text-on-panel-muted); }
  .qibla-card-cta { font-size: .8rem; font-weight: 600; color: var(--accent-strong); white-space: nowrap; }

  /* Highlight ring for the new entry point in the "main page" shots */
  .new-badge { outline: 3px dashed #4ade80; outline-offset: 4px; }

  /* Compass sheet */
  .compass-sheet .modal-content { max-height: none; overflow: visible; }
  .compass-sub { text-align: center; font-size: .85rem; color: var(--text-on-panel-muted); margin-top: -12px; margin-bottom: 12px; }
  .compass-stage { display: flex; justify-content: center; margin: 4px 0 12px; }
  .compass-readout { text-align: center; }
  .compass-deg { font-size: 2rem; font-weight: 700; color: var(--accent-strong); direction: ltr; line-height: 1.1; }
  .compass-dir { font-size: 1rem; color: var(--text-on-panel); }
  .compass-hint {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 18px;
    border-radius: 999px; font-weight: 600; font-size: .95rem;
    background: var(--surface-soft); border: 1px solid rgba(212,168,87,.45); color: var(--text-on-panel);
  }
  .compass-hint.ok { background: rgba(74,222,128,.16); border-color: rgba(74,222,128,.6); color: #86efac; }
  :root[data-theme="light"] .compass-hint.ok { color: #047857; }
  .compass-meta {
    display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; padding: 12px 14px;
    border-radius: 12px; background: var(--surface-soft); border: 1px solid var(--surface-border);
    font-size: .85rem; color: var(--text-on-panel-muted);
  }
  .compass-meta b { color: var(--accent-strong); font-weight: 600; }
  .compass-note { margin-top: 12px; font-size: .75rem; text-align: center; color: var(--text-on-panel-faint); }
  .compass-center { display: flex; flex-direction: column; align-items: center; }
  .perm-icon { width: 96px; height: 96px; color: var(--accent-strong); margin: 8px auto 16px; display: block; }
  .perm-text { text-align: center; color: var(--text-on-panel-muted); font-size: .95rem; margin-bottom: 20px; line-height: 1.6; }
  .btn-wide { width: 100%; padding: 14px; border-radius: 12px; border: none; font-family: inherit; font-size: 1rem; font-weight: 700;
    background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); color: var(--color-primary-dark); }
  .btn-link { display: block; margin: 12px auto 0; background: none; border: none; font-family: inherit; color: var(--text-on-panel-muted); font-size: .85rem; text-decoration: underline; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-soft); border: 1px solid rgba(212,168,87,.35); border-radius: 24px; margin: 0 auto 8px; }
  .seg span { padding: 5px 14px; font-size: .75rem; border-radius: 24px; color: var(--text-on-panel-muted); }
  .seg span.on { background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold)); color: var(--color-primary-dark); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const S = P.get('s') || 'main-a';
document.documentElement.dataset.theme = P.get('theme') || 'dark';

const sin = d => Math.sin(d * Math.PI / 180);
const cos = d => Math.cos(d * Math.PI / 180);
const r1 = n => Math.round(n * 10) / 10;

const ICON_COMPASS = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25"/><path class="needle" d="M15.6 8.4l-2.2 5-5 2.2 2.2-5z"/></svg>`;
const kotel = (x, y, w) => {
  // Stylised Western Wall: three rows of offset ashlar stones
  const h = w * 0.7, rows = 3, rh = h / rows; let s = `<g transform="translate(${x - w / 2},${y - h / 2})">`;
  s += `<rect width="${w}" height="${h}" rx="2" fill="#e6c47a" stroke="#8a6a2a" stroke-width="1"/>`;
  for (let i = 1; i < rows; i++) s += `<line x1="0" y1="${i * rh}" x2="${w}" y2="${i * rh}" stroke="#8a6a2a" stroke-width="1"/>`;
  for (let i = 0; i < rows; i++) {
    const off = i % 2 ? w / 4 : w / 2;
    for (let bx = off; bx < w; bx += w / 2) s += `<line x1="${bx}" y1="${i * rh}" x2="${bx}" y2="${(i + 1) * rh}" stroke="#8a6a2a" stroke-width="1"/>`;
  }
  return s + '</g>';
};

/* ---------- Compass renderers ---------- */
function dial({ heading, bearing, size = 270, aligned = false, northUp = false }) {
  const pad = 16, c = size / 2 + pad, R = size / 2, W = size + pad * 2;
  const rot = northUp ? 0 : -heading;
  const gold = '#d4a857', ok = '#4ade80';
  let ticks = '';
  for (let a = 0; a < 360; a += 5) {
    const long = a % 30 === 0, ra = R - 6, rb = R - (long ? 20 : 12);
    ticks += `<line x1="${r1(c + ra * sin(a))}" y1="${r1(c - ra * cos(a))}" x2="${r1(c + rb * sin(a))}" y2="${r1(c - rb * cos(a))}" stroke="${long ? gold : 'rgba(212,168,87,.5)'}" stroke-width="${long ? 2 : 1}"/>`;
  }
  const card = [['צפון', 0, '#f87171'], ['מזרח', 90], ['דרום', 180], ['מערב', 270]]
    .map(([t, a, col]) => `<text x="${r1(c + (R - 38) * sin(a))}" y="${r1(c - (R - 38) * cos(a) + 5)}" text-anchor="middle" font-size="14" font-weight="700" fill="${col || 'currentColor'}" transform="rotate(${-rot} ${r1(c + (R - 38) * sin(a))} ${r1(c - (R - 38) * cos(a))})">${t}</text>`).join('');
  const tx = c + (R - 62) * sin(bearing), ty = c - (R - 62) * cos(bearing);
  const needle = `<line x1="${c}" y1="${c}" x2="${r1(c + (R - 82) * sin(bearing))}" y2="${r1(c - (R - 82) * cos(bearing))}" stroke="${aligned ? ok : gold}" stroke-width="4" stroke-linecap="round"/>`;
  const target = `<g transform="rotate(${-rot} ${r1(tx)} ${r1(ty)})">${kotel(tx, ty, 34)}</g>`;
  const lubber = `<path d="M${c - 10} 2 L${c + 10} 2 L${c} 18 Z" fill="${aligned ? ok : gold}"/>`;
  return `<svg width="${W}" height="${W}" viewBox="0 0 ${W} ${W}" style="color:var(--text-on-panel)">
    <circle cx="${c}" cy="${c}" r="${R}" fill="var(--surface-soft)" stroke="${aligned ? ok : gold}" stroke-width="${aligned ? 4 : 2}" ${aligned ? 'style="filter:drop-shadow(0 0 10px rgba(74,222,128,.6))"' : ''}/>
    <circle cx="${c}" cy="${c}" r="${R - 26}" fill="none" stroke="rgba(212,168,87,.25)"/>
    <g transform="rotate(${rot} ${c} ${c})">${ticks}${card}${needle}${target}</g>
    <circle cx="${c}" cy="${c}" r="8" fill="${aligned ? ok : gold}"/>
    ${northUp ? '' : lubber}
  </svg>`;
}

function arrow({ heading, bearing, aligned }) {
  const d = bearing - heading, col = aligned ? '#4ade80' : '#d4a857';
  return `<svg width="260" height="260" viewBox="0 0 260 260">
    <circle cx="130" cy="130" r="120" fill="var(--surface-soft)" stroke="rgba(212,168,87,.35)" stroke-dasharray="4 6"/>
    <g transform="rotate(${d} 130 130)">
      <path d="M130 22 L178 112 L146 104 L146 214 L114 214 L114 104 L82 112 Z" fill="${col}" stroke="#8a6a2a" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <line x1="130" y1="0" x2="130" y2="14" stroke="var(--text-on-panel-muted)" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

function tape({ heading, bearing }) {
  const W = 340, H = 150, ppd = W / 120, cx = W / 2;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="color:var(--text-on-panel)">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(212,168,87,.05)"/><stop offset="1" stop-color="rgba(212,168,87,.22)"/></linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="${W}" height="${H}" rx="14"/></clipPath></defs>
    <g clip-path="url(#clip)"><rect width="${W}" height="${H}" fill="url(#sky)"/>
    <line x1="0" y1="96" x2="${W}" y2="96" stroke="rgba(212,168,87,.6)"/>`;
  const names = { 0: 'צ', 45: 'צ״מז', 90: 'מז', 135: 'ד״מז', 180: 'ד', 225: 'ד״מע', 270: 'מע', 315: 'צ״מע' };
  for (let a = Math.ceil((heading - 60) / 5) * 5; a <= heading + 60; a += 5) {
    const x = cx + (a - heading) * ppd, n = ((a % 360) + 360) % 360, big = n % 15 === 0;
    s += `<line x1="${r1(x)}" y1="96" x2="${r1(x)}" y2="${big ? 112 : 104}" stroke="rgba(212,168,87,.7)" stroke-width="${big ? 2 : 1}"/>`;
    if (names[n] !== undefined) s += `<text x="${r1(x)}" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="${n === 0 ? '#f87171' : 'currentColor'}">${names[n]}</text>`;
    else if (big) s += `<text x="${r1(x)}" y="130" text-anchor="middle" font-size="10" fill="var(--text-on-panel-faint)">${n}</text>`;
  }
  const kx = cx + (bearing - heading) * ppd;
  s += kotel(kx, 64, 64) + `<text x="${r1(kx)}" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#e6c47a">ירושלים</text>`;
  s += `</g><rect x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" rx="14" fill="none" stroke="#d4a857"/>
    <path d="M${cx - 9} ${H} L${cx + 9} ${H} L${cx} ${H - 14} Z" fill="#d4a857"/>
    <line x1="${cx}" y1="0" x2="${cx}" y2="${H - 14}" stroke="#d4a857" stroke-width="1.5" stroke-dasharray="3 4"/></svg>`;
  return s;
}

function miniDial(rotation) {
  return `<svg class="qibla-card-dial" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="26" fill="var(--surface-soft)" stroke="#d4a857" stroke-width="2"/>
    <g transform="rotate(${rotation} 28 28)"><path d="M28 8 L35 30 L28 26 L21 30 Z" fill="#d4a857"/><path d="M28 48 L35 30 L28 34 L21 30 Z" fill="rgba(212,168,87,.35)"/></g>
    <circle cx="28" cy="28" r="3" fill="#0f2442"/></svg>`;
}

/* ---------- Main page ---------- */
function mainPage({ variant, loc = 'תל אביב-יפו' }) {
  const cards = [
    ['🌌', 'עלות השחר', '04:50', 1], ['🌄', 'זמן טלית ותפילין', '05:15', 1], ['🌅', 'הנץ החמה', '06:09', 1, 'sunrise'],
    ['📖', 'סוף זמן ק״ש (גר״א)', '08:56', 1], ['🙏', 'סוף זמן תפילה (גר״א)', '09:52', 1], ['☀️', 'חצות היום', '11:33', 1],
    ['🕐', 'מנחה גדולה', '12:03', 0, 'active'], ['🌇', 'שקיעה', '16:45', 0, 'sunset']
  ].map(([i, n, t, passed, extra]) =>
    `<div class="time-card${passed ? ' time-card-passed' : ''}${extra ? ' ' + extra : ''}"><div class="time-card-header"><span class="time-icon">${i}</span></div><div class="time-card-body"><h3 class="time-name">${n}</h3><p class="time-value">${t}</p></div></div>`).join('');

  return `
  <div class="app-container">
    <header class="header"><div class="header-content">
      <h1 class="app-title"><svg class="app-title-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.25"></circle><path d="M12 6.4V12l3.6 2.1"></path></svg>זמני היום</h1>
      <p class="app-subtitle">זמני תפילה והלכה</p></div>
      ${variant === 'c' ? `<button class="btn btn-icon header-compass-btn new-badge" aria-label="מצפן תפילה">${ICON_COMPASS}</button>` : ''}
    </header>
    <main class="main-content">
      <section class="location-section panel">
        <div class="location-info"><span class="location-icon">📍</span><span class="location-name">${loc}</span></div>
        <div class="location-actions">
          ${variant === 'b' ? `<button class="btn btn-icon new-badge" aria-label="מצפן תפילה">${ICON_COMPASS}</button>` : ''}
          <button class="btn btn-icon">🔄</button>
        </div>
      </section>
      <section class="date-section panel"><div class="date-picker-container">
        <button class="date-picker-btn">📅</button>
        <div class="hebrew-date">יום ראשון, כ״ח בחשון התשפ״ז</div><div class="gregorian-date">8.11.2026</div></div>
      </section>
      ${variant === 'd' ? `
      <section class="qibla-card panel new-badge">
        ${miniDial(29)}
        <div class="qibla-card-text">
          <div class="qibla-card-title">כיוון התפילה</div>
          <div class="qibla-card-dir">דרום-מזרח · 129°</div>
          <div class="qibla-card-sub">לעבר הר הבית · 55 ק״מ</div>
        </div>
        <span class="qibla-card-cta">למצפן ←</span>
      </section>` : ''}
      <section class="next-zman-section panel" style="margin-bottom:2rem">
        <div class="next-zman-label">הזמן הבא:</div>
        <div class="next-zman-info"><span class="next-zman-name">מנחה גדולה</span><span class="next-zman-countdown">00:42:17</span><span class="next-zman-time">12:03</span></div>
      </section>
      <div class="zmanim-toolbar"><span class="section-eyebrow">זמני היום</span></div>
      <section class="zmanim-grid view-grid">${cards}</section>
    </main>
    <button class="btn btn-icon btn-settings">⚙️</button>
    ${variant === 'a' ? `<button class="btn-compass-fab new-badge">${ICON_COMPASS}<span>כיוון תפילה</span></button>` : ''}
  </div>`;
}

function sheet(title, sub, body) {
  return `<div class="modal-overlay active"></div>
  <div class="modal active compass-sheet"><div class="modal-handle"></div>
    <div class="modal-header"><h2 class="modal-title">${title}</h2><button class="modal-close">✕</button></div>
    ${sub ? `<p class="compass-sub">${sub}</p>` : ''}
    <div class="modal-content">${body}</div></div>`;
}

const meta = (place, dist) => `<div class="compass-meta"><span>📍 <b>${place}</b></span><span>מרחק: <b>${dist}</b></span></div>`;
const note = `<p class="compass-note">יש להרחיק את הטלפון ממתכות ומגנטים · לכיול – הזז את הטלפון בתנועת 8</p>`;

const screens = {
  'main-a': () => mainPage({ variant: 'a' }),
  'main-b': () => mainPage({ variant: 'b' }),
  'main-c': () => mainPage({ variant: 'c' }),
  'main-d': () => mainPage({ variant: 'd' }),

  'compass-dial': () => mainPage({}) + sheet('🧭 כיוון תפילה', 'לעבר ירושלים והר הבית', `
    <div class="compass-stage">${dial({ heading: 100, bearing: 129 })}</div>
    <div class="compass-readout"><div class="compass-deg">129°</div><div class="compass-dir">דרום-מזרח</div>
    <span class="compass-hint">↪ סובב ימינה 29°</span></div>${meta('תל אביב-יפו', '55 ק״מ')}`),

  'compass-dial-aligned': () => mainPage({}) + sheet('🧭 כיוון תפילה', 'לעבר ירושלים והר הבית', `
    <div class="compass-stage">${dial({ heading: 129, bearing: 129, aligned: true })}</div>
    <div class="compass-readout"><div class="compass-deg">129°</div><div class="compass-dir">דרום-מזרח</div>
    <span class="compass-hint ok">✓ אתה מכוון לירושלים</span></div>${meta('תל אביב-יפו', '55 ק״מ')}`),

  'compass-arrow': () => mainPage({}) + sheet('🧭 כיוון תפילה', 'לעבר ירושלים והר הבית', `
    <div class="compass-stage">${arrow({ heading: 100, bearing: 129 })}</div>
    <div class="compass-readout"><span class="compass-hint">↪ סובב ימינה 29°</span>
    <p class="compass-note" style="font-size:.85rem">החץ מצביע לירושלים · החזק את הטלפון שטוח</p></div>${meta('תל אביב-יפו', '55 ק״מ')}`),

  'compass-tape': () => mainPage({}) + sheet('🧭 כיוון תפילה', 'לעבר ירושלים והר הבית', `
    <div class="compass-stage" style="margin-top:12px">${tape({ heading: 110, bearing: 129 })}</div>
    <div class="compass-readout"><div class="compass-deg">129°</div><div class="compass-dir">דרום-מזרח</div>
    <span class="compass-hint">↪ סובב ימינה 19°</span></div>${meta('תל אביב-יפו', '55 ק״מ')}`),

  'compass-jerusalem': () => mainPage({ loc: 'ירושלים · רחביה' }) + sheet('🧭 כיוון תפילה', 'בירושלים – לעבר הכותל המערבי והר הבית', `
    <div class="compass-stage">${dial({ heading: 70, bearing: 78 })}</div>
    <div class="compass-readout"><div class="compass-deg">78°</div><div class="compass-dir">מזרח</div>
    <span class="compass-hint">↪ סובב ימינה 8°</span></div>${meta('ירושלים · רחביה', '2.4 ק״מ')}`),

  'compass-near-kotel': () => mainPage({ loc: 'ירושלים · העיר העתיקה' }) + sheet('🧭 כיוון תפילה', 'אתה ליד הכותל המערבי', `
    <div class="compass-center"><svg width="200" height="150" viewBox="0 0 200 150">${kotel(100, 75, 180)}</svg>
    <p class="perm-text" style="margin-top:16px">אתה נמצא במרחק פחות מ-500 מ׳ מהכותל.<br><b style="color:var(--accent-strong)">פנה אל הכותל / אל הר הבית.</b><br>בטווח זה מצפן אינו מדויק מספיק.</p></div>
    ${meta('ירושלים · העיר העתיקה', '180 מ׳')}`),

  'compass-permission': () => mainPage({}) + sheet('🧭 כיוון תפילה', '', `
    <div class="compass-center"><svg class="perm-icon" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.2">
      <circle cx="12" cy="12" r="9.25"/><path d="M15.6 8.4l-2.2 5-5 2.2 2.2-5z" fill="currentColor"/></svg>
    <p class="perm-text">כדי להראות לך לאן לפנות בזמן התפילה,<br>האפליקציה צריכה גישה למצפן של המכשיר.<br><small>המידע לא נשמר ולא נשלח לשום מקום.</small></p></div>
    <button class="btn-wide">אפשר גישה למצפן</button>
    <button class="btn-link">הצג כיוון ללא מצפן</button>`),

  'compass-no-sensor': () => mainPage({}) + sheet('🧭 כיוון תפילה', 'לעבר ירושלים והר הבית', `
    <div class="compass-stage">${dial({ heading: 0, bearing: 129, northUp: true })}</div>
    <div class="compass-readout"><div class="compass-deg">129°</div><div class="compass-dir">דרום-מזרח</div>
    <span class="compass-hint">ℹ️ למכשיר אין מצפן – הכיוון ביחס לצפון</span></div>${meta('תל אביב-יפו', '55 ק״מ')}`),

  'compass-diaspora': () => mainPage({ loc: 'New York, USA' }) + sheet('🧭 כיוון תפילה', 'לעבר ארץ ישראל וירושלים', `
    <div style="text-align:center"><div class="seg"><span class="on">הדרך הקצרה ביותר</span><span>מנהג: מזרח</span></div></div>
    <div class="compass-stage">${dial({ heading: 40, bearing: 54 })}</div>
    <div class="compass-readout"><div class="compass-deg">54°</div><div class="compass-dir">צפון-מזרח</div>
    <span class="compass-hint">↪ סובב ימינה 14°</span></div>${meta('New York', '9,170 ק״מ')}`)
};

document.getElementById('root').innerHTML = (screens[S] || screens['main-a'])();
</script>
</body>
</html>
