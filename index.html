<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a365d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="זמני היום">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    
    <title>זמני היום - Zmaney HaYom</title>
    <meta name="description" content="זמני תפילה והלכה - Jewish Prayer Times App">
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link rel="manifest" href="manifest.json">
    
    <!-- Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header" style="margin-bottom: 2rem;">
            <div class="header-content">
                <h1 class="app-title">🕐 זמני היום</h1>
                <p class="app-subtitle">זמני תפילה והלכה</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Location Section -->
            <section class="location-section">
                <div class="location-info">
                    <span class="location-icon">📍</span>
                    <span id="location-name" class="location-name">מאתר מיקום...</span>
                </div>
                <button id="refresh-btn" class="btn btn-icon" aria-label="רענן מיקום">
                    🔄
                </button>
            </section>

            <!-- Date Section -->
            <section class="date-section">
                <div class="date-picker-container">
                    <div id="hebrew-date" class="hebrew-date">טוען תאריך...</div>
                    <div id="gregorian-date" class="gregorian-date"></div>
                    <button id="date-picker-btn" class="date-picker-btn" aria-label="בחר תאריך">
                        📅
                    </button>
                    <input type="date" id="date-input" class="date-input-hidden">
                </div>
                <button id="today-btn" class="today-btn" style="display: none;">
                    חזור להיום
                </button>
            </section>

            <!-- Next Zman Countdown -->
            <section id="next-zman" class="next-zman-section" style="display: none; margin-bottom: 2rem;">
                <div class="next-zman-label">הזמן הבא:</div>
                <div class="next-zman-info">
                    <span id="next-zman-name" class="next-zman-name"></span>
                    <span id="next-zman-countdown" class="next-zman-countdown"></span>
                    <span id="next-zman-time" class="next-zman-time"></span>
                </div>
            </section>

            <!-- Loading State -->
            <div id="loading" class="loading-container">
                <div class="spinner"></div>
                <p>טוען זמנים...</p>
            </div>

            <!-- Error State -->
            <div id="error" class="alert alert-error" style="display: none;">
                <span class="alert-icon">⚠️</span>
                <span id="error-message">שגיאה בטעינת הנתונים</span>
                <button id="retry-btn" class="btn btn-secondary">נסה שוב</button>
            </div>

            <!-- Zmanim Grid -->
            <section id="zmanim-container" class="zmanim-grid" style="display: none;">
                <!-- Cards will be injected here by JavaScript -->
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>נתונים מ-<a href="https://www.hebcal.com" target="_blank" rel="noopener">Hebcal</a></p>
            <p class="footer-note">הזמנים להלכה בלבד - יש להתייעץ עם רב</p>
        </footer>

        <!-- Settings Button (Fixed Position) -->
        <button class="btn btn-icon btn-settings" id="settings-btn" aria-label="הגדרות">
            ⚙️
        </button>

        <!-- Settings Modal -->
        <div class="modal-overlay" id="settings-overlay"></div>
        <div class="modal" id="settings-modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h2 class="modal-title">הגדרות תצוגה</h2>
                <button class="modal-close" id="settings-close" aria-label="סגור">✕</button>
            </div>
            <div class="modal-content">
                <p class="settings-description">בחר אילו זמנים להציג:</p>
                
                <div class="settings-group" id="zmanim-toggles">
                    <!-- Toggles will be generated by JavaScript -->
                </div>

                <div class="settings-actions">
                    <button class="btn btn-secondary" id="select-all-btn">בחר הכל</button>
                    <button class="btn btn-secondary" id="deselect-all-btn">נקה הכל</button>
                </div>
            </div>
        </div>

        <!-- Location Picker Modal -->
        <div class="modal-overlay" id="location-overlay"></div>
        <div class="modal location-modal" id="location-modal">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <h2 class="modal-title">בחר מיקום</h2>
                <button class="modal-close" id="location-close" aria-label="סגור">✕</button>
            </div>
            <div class="modal-content">
                
                <!-- Search Box -->
                <div class="location-search">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input 
                            type="text" 
                            id="location-search-input" 
                            class="search-input"
                            placeholder="חפש עיר או מיקום..."
                            autocomplete="off"
                        >
                        <button class="search-clear" id="search-clear" style="display: none;">✕</button>
                    </div>
                    <div class="search-results" id="search-results" style="display: none;"></div>
                </div>

                <!-- Current Location Button -->
                <button class="location-option location-current" id="use-current-location">
                    <span class="location-option-icon">📍</span>
                    <div class="location-option-text">
                        <span class="location-option-name">השתמש במיקום הנוכחי</span>
                        <span class="location-option-sub">זיהוי אוטומטי באמצעות GPS</span>
                    </div>
                    <span class="location-option-arrow">←</span>
                </button>

                <!-- Favorites Section -->
                <div class="location-section" id="favorites-section">
                    <div class="location-section-header">
                        <h3 class="location-section-title">⭐ מיקומים שמורים</h3>
                    </div>
                    <div class="location-list" id="favorites-list">
                        <p class="location-empty">אין מיקומים שמורים</p>
                    </div>
                </div>

                <!-- Recent Searches Section -->
                <div class="location-section" id="recent-section">
                    <div class="location-section-header">
                        <h3 class="location-section-title">🕐 חיפושים אחרונים</h3>
                    </div>
                    <div class="location-list" id="recent-list">
                        <p class="location-empty">אין חיפושים אחרונים</p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
